name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (typecheck, unit, e2e, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright test
      - name: Pages build
        run: npm run build && test -f dist/index.html

  mac:
    name: Mac app (compile)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - id: check
        run: test -f mac/project.yml && echo "has=true" >> "$GITHUB_OUTPUT" || echo "has=false" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.has == 'true'
        run: brew install xcodegen xcbeautify
      - if: steps.check.outputs.has == 'true'
        working-directory: mac
        # xcbeautify turns compile errors into GitHub annotations, which Claude can read through the API
        # (raw job logs are not reachable from Claude's sandbox).
        run: |
          set -o pipefail
          xcodegen
          xcodebuild -project SilentSpeechBridge.xcodeproj -target SilentSpeechBridge -configuration Debug CODE_SIGNING_ALLOWED=NO build 2>&1 | xcbeautify --renderer github-actions
      - if: steps.check.outputs.has == 'true'
        name: No Xcode build path (build.sh, Command Line Tools only)
        working-directory: mac
        run: |
          set -o pipefail
          rm -rf build
          ./build.sh 2>&1 | tee /tmp/build.log || { grep -E "error:" /tmp/build.log | head -20 | sed 's/^/::error::/'; exit 1; }
          test -x build/Debug/SilentSpeechBridge.app/Contents/MacOS/SilentSpeechBridge
          test -f build/Debug/SilentSpeechBridge.app/Contents/Resources/AppIcon.icns
          iconutil -c iconset -o /tmp/AppIcon.iconset SilentSpeechBridge/AppIcon.icns && ls /tmp/AppIcon.iconset
      - if: steps.check.outputs.has == 'true'
        name: Release build (build.sh --release, universal, what release.yml ships)
        working-directory: mac
        run: |
          set -o pipefail
          SIGN_IDENTITY=- ./build.sh --release 2>&1 | tee /tmp/build-release.log || { grep -E "error:" /tmp/build-release.log | head -20 | sed 's/^/::error::/'; exit 1; }
          lipo build/Release/SilentSpeechBridge.app/Contents/MacOS/SilentSpeechBridge -verify_arch arm64 x86_64
          ./check-weak-links.sh build/Release/SilentSpeechBridge.app/Contents/MacOS/SilentSpeechBridge
      - if: steps.check.outputs.has != 'true'
        run: echo "No Mac app yet, skipping."

  python:
    name: Python bench (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: check
        run: test -f ml/pyproject.toml && echo "has=true" >> "$GITHUB_OUTPUT" || echo "has=false" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.has == 'true'
        uses: astral-sh/setup-uv@v6
      - if: steps.check.outputs.has == 'true'
        working-directory: ml
        run: uv sync && uv run pytest -q
      - if: steps.check.outputs.has != 'true'
        run: echo "No Python bench yet, skipping."
