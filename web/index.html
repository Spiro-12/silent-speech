<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Silent Speech: talk to your Mac without making a sound</title>
  <meta name="description" content="Wear AirPods, silently mouth a sentence, and your Mac does it. The motion sensor in your AirPods picks up your jaw. Free and open source." />
  <meta name="theme-color" content="#0b0d12" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="canonical" href="https://spiro-12.github.io/silent-speech/" />
  <!-- Share previews (X, Instagram, iMessage, Slack...): absolute URLs, the image is 1200x630 -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Silent Speech" />
  <meta property="og:url" content="https://spiro-12.github.io/silent-speech/" />
  <meta property="og:title" content="Silent Speech: talk to your Mac without making a sound" />
  <meta property="og:description" content="Wear AirPods, silently mouth a sentence, and your Mac does it. Watch a real session, then set it up on your own Mac." />
  <meta property="og:image" content="https://spiro-12.github.io/silent-speech/og.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Silent Speech: talk without making a sound. You said: Text mom I'm on my way." />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Silent Speech: talk to your Mac without making a sound" />
  <meta name="twitter:description" content="Wear AirPods, silently mouth a sentence, and your Mac does it. Free and open source." />
  <meta name="twitter:image" content="https://spiro-12.github.io/silent-speech/og.png" />
  <meta name="twitter:image:alt" content="Silent Speech: talk without making a sound. You said: Text mom I'm on my way." />
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>Silent Speech</h1>
      <span class="tag">read your lips with AirPods</span>
    </div>
    <div class="meta">
      <span class="pill" data-testid="source-pill">… · connecting</span>
      <span class="stat" data-testid="hz-browser">0.0 Hz</span>
      <span class="stat muted">samples <b data-testid="sample-count">0</b></span>
      <select data-testid="fake-label" hidden></select>
      <button data-testid="mode-toggle" class="ghost">Mode</button>
    </div>
  </header>
  <main>
    <button class="ptt" data-testid="ptt" aria-label="Hold to talk">
      <span class="dot"></span><span>Hold <kbd>Space</kbd> (or hold here) and silently mouth a sentence</span>
    </button>
    <div id="panels" class="grid"></div>
  </main>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
